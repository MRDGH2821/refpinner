---
jobs:
  packslip:
    name: Sign packslip
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - id: packslip
        uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        with:
          bin: refpinner
          download: refpinner-*.tar.xz refpinner-*.zip
          upload: false
          # Musl archives share os/arch/format with gnu; mark them as variants.
          variants: |
            refpinner-aarch64-unknown-linux-musl.tar.xz=musl
            refpinner-x86_64-unknown-linux-musl.tar.xz=musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
  publish-packslip:
    name: Upload packslip
    needs: packslip
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip-bundle
          path: packslip
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        name: Upload the signed bundle
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "$TAG" packslip/packslip.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
# Reusable workflow called by dist after announce (post-announce-jobs).
# Signs packslip.sigstore.json without giving the action contents: write.
# https://packslip.dev/docs/publishing/#keep-the-action-away-from-release-write-access
name: packslip
on: # ryl disable-line rule:truthy
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions: {}
