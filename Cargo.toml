[package]
name = "refpinner"
version = "0.0.0"
edition = "2024"
description = "Local-first CI dependency pinning and updates"
license-file = "LICENSE"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
globset = "0.4.21"
ignore = "0.4.34"
regex = "1.13.1"
ring = "0.17.14"
saphyr = "0.3.4"
saphyr-parser = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
