[package]
name = "refpinner"
version = "0.0.0"
edition = "2024"
description = "Local-first CI dependency pinning and updates"
license-file = "LICENSE"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
saphyr = "0.3.4"
saphyr-parser = "0.3.4"
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
